name: Unit Tests, Typecheck & Lint

on:
  # Runs on PRs (gate) and is called by deploy.yml on push to main (workflow_call).
  # No standalone push trigger: on main the deploy pipeline runs it via needs:[test]
  # so it isn't executed twice per push.
  pull_request:
    branches: [main]
  workflow_call: # Allows deploy.yml to gate on this workflow

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install development tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.24

      - name: Install dependencies
        run: mise exec -- npm ci

      # Blocks on critical advisories in production dependencies. Highs are
      # reported (see the audit output) but don't fail the gate yet.
      - name: Security audit (runtime deps, critical blocks)
        run: mise exec -- npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: mise run db:generate

      # next typegen + tsc for the app, then tsc for e2e/ + playwright.config.ts.
      - name: Typecheck
        run: mise run typecheck

      - name: Run unit tests
        run: mise run test

      # Lint is clean (0 problems) and now gates the pipeline to keep it that way.
      - name: Lint
        run: mise run lint
