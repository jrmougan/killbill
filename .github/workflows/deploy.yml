name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

# Never run two deploys of main at once; queue them instead of cancelling one
# mid-push/mid-redeploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: [e2e, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Full commit SHA (immutable; the deploy job pins Coolify to it) +
          # `latest`, kept only for compatibility.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Check every secret before touching Coolify: a missing one must stop the
      # deploy before the PATCH, never leave the tag changed without a redeploy.
      - name: Check Coolify secrets
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          missing=0
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error title=Falta COOLIFY_API_TOKEN::Crea en Coolify un token acotado con permiso write y guárdalo como secret COOLIFY_API_TOKEN del repo; sin él no se puede fijar el tag inmutable. No se ha desplegado nada."
            missing=1
          fi
          for name in COOLIFY_WEBHOOK COOLIFY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Falta ${name}::El secret ${name} no está configurado. No se ha desplegado nada."
              missing=1
            fi
          done
          exit "$missing"

      # Pin the app to this commit's tag (not `latest`) so a redeploy or restart
      # always runs exactly the image built here.
      - name: Point Coolify to this immutable image
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          curl --fail-with-body -sS \
            -X PATCH "https://coolify.mougan.es/api/v1/applications/w17ddm6y7ro4kpgq3i6nbrkr" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\":\"${IMAGE_TAG}\"}"

      - name: Trigger Coolify deployment
        run: |
          curl --fail --request POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
