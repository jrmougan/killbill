name: E2E Tests

on:
  # Runs on PRs (gate) and is called by deploy.yml on push to main (workflow_call).
  # No standalone push trigger: on main the deploy pipeline runs it via needs:[e2e]
  # so it isn't executed twice per push.
  pull_request:
    branches: [main]
  workflow_call: # Allows deploy.yml to call this workflow

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: killbill_test
          MYSQL_USER: killbill_test
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://killbill_test:test_password@127.0.0.1:3306/killbill_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USER: killbill_test
      DATABASE_PASSWORD: test_password
      DATABASE_NAME: killbill_test
      DATABASE_PORT: "3306"
      JWT_SECRET: e2e_test_jwt_secret_not_for_production
      NODE_ENV: test
      TEST_ROUTES_ENABLED: 'true'
      GEMINI_API_KEY: fake_key_not_needed_for_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.17

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Verify E2E fixtures and CI reporting
        run: mise exec -- npx vitest run --config e2e/fixtures/vitest.config.ts

      - name: Install Playwright browsers
        run: mise exec -- npx playwright install chromium --with-deps

      - name: Run database migrations
        run: mise run db:migrate

      - name: Generate Prisma client
        run: mise run db:generate

      - name: Build app
        run: mise run build

      - name: Seed admin user
        run: mise run db:seed

      - name: Copy static assets for standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Run E2E tests
        run: mise run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
