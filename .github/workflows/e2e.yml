name: E2E Tests

on:
  # Runs on PRs (gate) and is called by deploy.yml on push to main (workflow_call).
  # No standalone push trigger: on main the deploy pipeline runs it via needs:[e2e]
  # so it isn't executed twice per push.
  pull_request:
    branches: [main]
  workflow_call: # Allows deploy.yml to call this workflow

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mysql://killbill_test:test_password@127.0.0.1:3306/killbill_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USER: killbill_test
      DATABASE_PASSWORD: test_password
      DATABASE_NAME: killbill_test
      DATABASE_PORT: "3306"
      # Consumed by compose.dev.yaml (same MySQL 8.0 service as local dev).
      COMPOSE_PROJECT_NAME: killbill-ci
      MYSQL_ROOT_PASSWORD: test_root
      JWT_SECRET: e2e_test_jwt_secret_not_for_production
      TEST_ROUTES_ENABLED: 'true'
      GEMINI_API_KEY: fake_key_not_needed_for_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install development tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.24

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      # MySQL 8.0 from compose.dev.yaml rather than a `services:` container: a
      # service container can't receive the server flags we need
      # (--default-authentication-plugin=mysql_native_password, required by
      # @prisma/adapter-mariadb, exactly like production). Compose waits for its
      # healthcheck (a real `SELECT 1` as the app user over TCP).
      - name: Start MySQL 8.0
        run: mise exec -- node scripts/dev-compose.mjs up --detach --wait --wait-timeout 180

      - name: Verify E2E fixtures and CI reporting
        run: mise exec -- npx vitest run --config e2e/fixtures/vitest.config.ts

      - name: Install Playwright browsers
        run: mise exec -- npx playwright install chromium --with-deps

      - name: Run database migrations
        run: mise run db:migrate

      - name: Generate Prisma client
        run: mise run db:generate

      - name: Build app
        run: mise run build

      - name: Seed admin user
        run: mise run db:seed

      - name: Copy static assets for standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # NODE_ENV=test only here: the build above must stay production, like the
      # deployed image.
      - name: Run E2E tests
        run: mise run e2e
        env:
          NODE_ENV: test

      - name: Dump MySQL logs on failure
        if: failure()
        run: mise exec -- node scripts/dev-compose.mjs logs db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
